# The web version (wasm/, web/ in web mode) on GitHub Pages: Settings -> Pages -> Source: GitHub Actions.
name: Web version (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Submodules (wifi-sdr, then devourer; not --recursive)
        run: |
          git submodule update --init external/wifi-sdr
          git -C external/wifi-sdr submodule update --init external/devourer
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y binutils-mipsel-linux-gnu xxd cmake pkg-config
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Engine (WebAssembly; also runs the DSP tests as WebAssembly)
        run: wasm/build.sh jspi
      - name: Page
        working-directory: web
        run: npm ci && npm test && npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
